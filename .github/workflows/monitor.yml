name: Мониторинг чая

on:
  schedule:
    # Каждые 10 минут (GitHub может запускать с задержкой в несколько минут).
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Отправить в Telegram тестовое сообщение"
        type: boolean
        default: false

permissions:
  contents: write  # сохранить state/state.json
  actions: write   # не дать GitHub выключить расписание из-за «неактивности» репозитория

concurrency:
  group: tea-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить каталог
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_MESSAGE: ${{ inputs.test_message }}
        run: python -m tea_monitor

      - name: Сохранить состояние
        env:
          COMMIT_MESSAGE: ${{ steps.monitor.outputs.commit_message }}
        run: |
          if [ -z "$(git status --porcelain -- state)" ]; then
            echo "Состояние не изменилось."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -q -m "${COMMIT_MESSAGE:-Каталог: обновление состояния}"
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch -q --depth=50 origin "${GITHUB_REF_NAME}"
            git rebase -q FETCH_HEAD
          done
          echo "::error::Не удалось сохранить состояние в репозиторий"
          exit 1

      - name: Не дать GitHub отключить расписание
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub выключает расписание в публичных репозиториях после 60 дней без активности.
          # Раз в сутки «включаем» workflow заново — это сбрасывает счётчик.
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/enable" --silent
          fi
